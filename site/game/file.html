
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon 26.3 Beta</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Warning Screen */
        #warning-screen {
            width: 100%;
            height: 100%;
            background-color: #808080;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            color: white;
        }

        #warning-text {
            font-size: 28px;
            font-weight: bold;
            max-width: 850px;
            margin-bottom: 25px;
        }

        #countdown {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        #skip-button {
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            background-color: #333;
            color: white;
            cursor: pointer;
        }

        #skip-button:hover {
            background-color: #222;
        }

        /* Website iframe */
        #website {
            display: none;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

    <div id="warning-screen">
        <div id="warning-text">
            THIS IS NOT OUR RELEASE IT IS SIMPLY TO LET PEOPLE PLAY A BUGGIER RELEASE TILL WE RELEASE OURS
        </div>

        <div id="countdown">10</div>

        <button id="skip-button" onclick="openWebsite()">
            Skip Timer
        </button>
    </div>

    <iframe
        id="website"
        src="https://web.carrot-craft.org/horizon-26-3-beta/"
        allowfullscreen>
    </iframe>

    <script>
        let timeLeft = 10;
        const countdown = document.getElementById("countdown");

        const timer = setInterval(() => {
            timeLeft--;
            countdown.textContent = timeLeft;

            if (timeLeft <= 0) {
                openWebsite();
            }
        }, 1000);

        function openWebsite() {
            clearInterval(timer);

            document.getElementById("warning-screen").style.display = "none";
            document.getElementById("website").style.display = "block";
        }
    </script>

</body>
</html>
